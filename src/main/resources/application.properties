# ===============================
# CONFIGURACIÓN DE MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/banco_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CONFIGURACIÓN DE MONGODB
spring.mongodb.uri=mongodb://localhost:27017/banco_logs

# ===============================
# CONFIGURACIÓN DE JWT
# ===============================
jwt.secret=mySecretKeyForBankSystem2026WithEnoughLengthForHS256AlgorithmEncryption
jwt.expiration=86400000

server.port=8081